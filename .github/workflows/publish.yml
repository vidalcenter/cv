on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate CV PDFs
        run: |
          quarto render cv-pdf.qmd --to pdf --output cv-luiz-diego.pdf
          quarto render cv-pdf-en.qmd --to pdf --output cv-luiz-diego-en.pdf
          quarto render cv-pdf-es.qmd --to pdf --output cv-luiz-diego-es.pdf

      - name: Move PDFs to site output
        run: |
          mkdir -p _site
          cp cv-luiz-diego.pdf _site/cv-luiz-diego.pdf
          cp cv-luiz-diego-en.pdf _site/cv-luiz-diego-en.pdf
          cp cv-luiz-diego-es.pdf _site/cv-luiz-diego-es.pdf

      - name: Backup book PDFs
        run: |
          mkdir -p /tmp/book-pdfs
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if ls books/$book/_book/*.pdf 1> /dev/null 2>&1; then
              echo "=== Backing up PDFs from $book ==="
              mkdir -p /tmp/book-pdfs/$book
              cp books/$book/_book/*.pdf /tmp/book-pdfs/$book/
            fi
          done

      - name: Render Books (HTML only)
        run: |
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if [ -f "books/$book/_quarto.yml" ]; then
              echo "=== Rendering $book ==="
              cd books/$book
              quarto render --to html
              cd ../..
            fi
          done

      - name: Restore book PDFs
        run: |
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if [ -d "/tmp/book-pdfs/$book" ]; then
              echo "=== Restoring PDFs to $book ==="
              cp /tmp/book-pdfs/$book/*.pdf books/$book/_book/
            fi
          done

      - name: Render Aulas (RevealJS slides)
        run: |
          for disciplina in analise_ambiental analise_paisagem analise_dados_ambientais bioengenharia_de_solos branding_agro ciencia_pi extensao_rural geotecnologias_sig geotexteis introducao_estatistica sociologia_rural; do
            aulas_dir="aulas/$disciplina/aulas"
            if [ -d "$aulas_dir" ]; then
              echo "=== Rendering slides: $disciplina ==="
              find "$aulas_dir" -name "*.qmd" -type f | while read qmd; do
                echo "  -> $(basename $qmd)"
                quarto render "$qmd" || echo "  !! WARN: falha em $(basename $qmd)"
              done
            fi
          done

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Copy book output to site
        run: |
          for book in bioengenharia-solos ciencia-paisagem geotecnologias-sig pi branding-agro; do
            if [ -d "books/$book/_book" ]; then
              echo "=== Copying $book ==="
              mkdir -p _site/books/$book
              cp -r books/$book/_book/* _site/books/$book/
            fi
          done

      - name: Copy CNAME for custom domain
        run: cp CNAME _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
