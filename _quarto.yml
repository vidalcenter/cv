project:
  type: website
  render:
    - "*.qmd"
    - "!scripts/"
    - "!aulas/"
    - "!books/"
    - "!cv-pdf.qmd"
    - "!cv-pdf-en.qmd"
    - "!cv-pdf-es.qmd"
    - "!teaching/**/plano-pdf.qmd"
    - "!teaching/**/avaliacoes/*_gabarito.qmd"
resources:
  - CNAME
  - cv-luiz-diego.pdf
  - cv-luiz-diego-en.pdf
  - cv-luiz-diego-es.pdf
  - aulas/**/*.html
  - aulas/**/*_files/**
  - aulas/**/extras/*.xlsx
  - aulas/assets/**
  - books/**
  - teaching/**/*.html
  - teaching/**/*.pdf
  - teaching/**/SVG/**
  - teaching/**/*.mp3

website:
  title: "Prof. Diego Vidal"
  site-url: https://diegovidalcv.com.br/
  description: "Engenheiro Agrônomo, Doutor em Propriedade Intelectual e Inovação, Professor Visitante (UEFS). Líder do grupo PLANeT-Inova."
  favicon: img/portrait_2x3midres.jpeg
  navbar:
    background: dark
    left:
      - href: index.qmd
        text: "{{< fa house >}} Início"
      - href: papers/publicacoes.qmd
        text: "{{< fa file-lines >}} Publicações"
      - href: teaching/index.qmd
        text: "{{< fa chalkboard-user >}} Ensino"
      # - href: talks/index.qmd
      #   text: "{{< fa microphone >}} Palestras"
      - href: media/index.qmd
        text: "{{< fa newspaper >}} Mídia"
      - href: posts/index.qmd
        text: "{{< fa pen-nib >}} Blog"
    right:
      - text: "EN"
        href: index-en.qmd
      - text: "ES"
        href: index-es.qmd
      - text: "FR"
        href: index-fr.qmd
      - icon: file-earmark-pdf
        url: cv-luiz-diego.pdf
        aria-label: Download CV
      - icon: envelope-fill
        url: mailto:ldvsantos@uefs.br
        aria-label: Email
      - text: "{{< ai orcid >}}"
        url: https://orcid.org/0000-0001-8659-8557
        aria-label: ORCID
  page-footer:
    left: "© Luiz Diego Vidal Santos, 2025–2026. [Disclaimer](disclaimer)"
    right: "Feito com [Quarto](https://quarto.org)"
  twitter-card: true
  open-graph: true
  google-analytics: "395640625"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    css: styles.css
    toc: true
    toc_depth: 3
    toc_float: true
    toc_smooth_scroll: true
    toc_highlight: true
    fig-align: center
    lang: pt-BR
    include-in-header:
      text: |
        <a class="skip-link" href="#quarto-content">Pular para o conteúdo</a>
        <script type='application/ld+json'>{"@context":"http://www.schema.org","@type":"person","name":"Luiz Diego Vidal Santos","jobTitle":"Professor Visitante e Pesquisador","gender":"male","description":"Engenheiro Agrônomo, Doutor em Propriedade Intelectual e Inovação. Professor Visitante no PPG em Planejamento Territorial da UEFS. Líder do grupo PLANeT-Inova.","address":{"@type":"PostalAddress","addressLocality":"Aracaju","addressRegion":"SE","addressCountry":"Brasil"},"worksFor":[{"@type":"Organization","name":"UEFS"}]}</script>
        <script>document.addEventListener("DOMContentLoaded",function(){document.querySelectorAll("a h1,a h2,a h3,a h4,a h5,a h6").forEach(function(h){h.classList.remove("anchored");h.removeAttribute("data-anchor-id")})});</script>
        <script>document.addEventListener("DOMContentLoaded",function(){var p=window.location.pathname,b=p.replace(/-(en|es|fr)\.html$/,'.html').replace(/\.html$/,'').replace(/\/$/,'/index');if(/^\/(?:index|[^\/]+\/index|papers\/(?:publicacoes|livros))$/.test(b)){document.querySelectorAll('.navbar a').forEach(function(a){var t=a.textContent.trim();if(t==='EN')a.href=b+'-en.html';else if(t==='ES')a.href=b+'-es.html';else if(t==='FR')a.href=b+'-fr.html';});}});</script>




